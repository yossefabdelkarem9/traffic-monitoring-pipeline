services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:15
    container_name: postgres_dwh
    restart: unless-stopped

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dwh_init/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-airflow} -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    build: .

    container_name: airflow_init

    depends_on:
      postgres:
        condition: service_healthy

    environment: &airflow-env

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_password}@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__WEBSERVER__SECRET_KEY: >-
        ${AIRFLOW_SECRET_KEY:-local-development-secret}

      AIRFLOW__CORE__FERNET_KEY: >-
        ${AIRFLOW_FERNET_KEY:-Onj1EMOC45zoDIBMIEb8PGjwWZjarutQko4IZt0NpZ8=}

      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: traffic-telemetry
      KAFKA_BATCH_GROUP: traffic-batch-consumer

      DB_HOST: postgres
      DB_NAME: traffic_dwh
      DB_USER: ${POSTGRES_USER:-airflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-airflow_password}
      DB_PORT: 5432

    command: bash -c "airflow db migrate && ( airflow users create --username $${AIRFLOW_ADMIN_USER:-admin} --password $${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email $${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true )"

    restart: "no"

  airflow-webserver:
    build: .

    container_name: airflow_webserver

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    environment: *airflow-env

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs

    command: webserver

  airflow-scheduler:
    build: .

    container_name: airflow_scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

    environment: *airflow-env

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs

    command: scheduler

  realtime-consumer:
    build: .

    container_name: traffic_realtime_consumer

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

    environment:

      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: traffic-telemetry

      KAFKA_GROUP: traffic-realtime-consumer

      DB_HOST: postgres
      DB_NAME: traffic_dwh
      DB_USER: ${POSTGRES_USER:-airflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-airflow_password}
      DB_PORT: 5432

      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      DB_BATCH_SIZE: ${DB_BATCH_SIZE:-50}

    volumes:
      - ./realtime:/opt/realtime:ro

    entrypoint: ""
    command:
      python3 /opt/realtime/realtime_consumer.py

  dashboard:
    build: ./dashboard

    container_name: traffic_dashboard

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      realtime-consumer:
        condition: service_started

    environment:
      DB_HOST: postgres
      DB_NAME: traffic_dwh
      DB_USER: ${POSTGRES_USER:-airflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-airflow_password}
      DB_PORT: 5432

    ports:
      - "8501:8501"

    volumes:
      - ./dashboard/app.py:/app/app.py:ro

volumes:
  postgres_data: